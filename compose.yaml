services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tensorforge
      POSTGRES_USER: tensorforge
      POSTGRES_PASSWORD: tensorforge-local-dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tensorforge -d tensorforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: tensorforge-mvp
    depends_on:
      database:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY:-local-development-key}
      DATABASE_URL: postgresql://tensorforge:tensorforge-local-dev@database:5432/tensorforge
      SUPPORT_PASSWORD: ${SUPPORT_PASSWORD:-local-support-password}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
