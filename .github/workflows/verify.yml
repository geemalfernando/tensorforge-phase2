name: Verify service and offline container
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run build --prefix frontend
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/evaluate_model.py --output /tmp/evaluation-breakdown.json
      - run: docker build -t tensorforge-mvp .
      - name: Verify published port and offline runtime
        env:
          API_KEY: ci-only-verification-key
        run: python scripts/verify_container.py --image tensorforge-mvp
