<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .h{font-size:12px;font-weight:700;fill:#64748b;letter-spacing:1px}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dl{stroke:#475569;stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .lb{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>

  <!-- Clients -->
  <text x="30" y="34" class="h">CLIENTS</text>
  <rect x="30" y="46" width="260" height="78" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="46" y="72" class="t">Support dashboard</text>
  <text x="46" y="92" class="s">React + Vite (ResolveX UI): intake, live</text>
  <text x="46" y="108" class="s">ops, support queue, batch, model lab</text>
  <rect x="30" y="140" width="260" height="78" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="46" y="166" class="t">Judge demo / evaluator</text>
  <text x="46" y="186" class="s">Own API key (page memory only),</text>
  <text x="46" y="202" class="s">Postman, curl, scripts</text>

  <!-- Edge -->
  <text x="340" y="34" class="h">EDGE</text>
  <rect x="340" y="46" width="200" height="172" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="356" y="72" class="t">Request routing</text>
  <text x="356" y="94" class="s">Vercel rewrites (hosted)</text>
  <text x="356" y="110" class="s">or one container :8000</text>
  <text x="356" y="138" class="s">/health /auth /predict</text>
  <text x="356" y="154" class="s">/batch /dashboard /docs</text>
  <text x="356" y="170" class="s">  → FastAPI</text>
  <text x="356" y="194" class="s">everything else → static UI</text>

  <path class="ln" d="M290,85 H338"/>
  <path class="ln" d="M290,179 H338"/>

  <!-- API -->
  <text x="590" y="34" class="h">API SERVICE (FastAPI, app/main.py)</text>
  <rect x="590" y="46" width="580" height="300" rx="12" fill="#ecfeff" stroke="#0891b2"/>
  <rect x="606" y="62" width="268" height="70" rx="8" fill="#fff" stroke="#67e8f9"/>
  <text x="620" y="86" class="t">Auth + validation</text>
  <text x="620" y="105" class="s">X-API-Key / Bearer, constant-time check</text>
  <text x="620" y="121" class="s">OpenAPI 2.1.0 request schemas, JSON errors</text>
  <rect x="886" y="62" width="268" height="70" rx="8" fill="#fff" stroke="#67e8f9"/>
  <text x="900" y="86" class="t">Dashboard bridge</text>
  <text x="900" y="105" class="s">/dashboard/api/* adds server key</text>
  <text x="900" y="121" class="s">internally; support review routes</text>
  <rect x="606" y="146" width="268" height="84" rx="8" fill="#fff" stroke="#67e8f9"/>
  <text x="620" y="170" class="t">Synchronous inference</text>
  <text x="620" y="189" class="s">POST /predict, /predict/batch (1–100)</text>
  <text x="620" y="205" class="s">thread pool keeps event loop free;</text>
  <text x="620" y="221" class="s">order preserved, IDs echoed</text>
  <rect x="886" y="146" width="268" height="84" rx="8" fill="#fff" stroke="#67e8f9"/>
  <text x="900" y="170" class="t">Async job manager (app/jobs.py)</text>
  <text x="900" y="189" class="s">POST /batch/jobs (1–5,000), poll,</text>
  <text x="900" y="205" class="s">paged results, cancel/discard,</text>
  <text x="900" y="221" class="s">idempotency keys, ≤4 active jobs</text>
  <rect x="606" y="244" width="548" height="88" rx="8" fill="#fff" stroke="#67e8f9"/>
  <text x="620" y="268" class="t">Job workers (chunks of 100 tickets)</text>
  <text x="620" y="288" class="s">Local / Docker: in-process background worker thread</text>
  <text x="620" y="306" class="s">Vercel: status polls process the job (Postgres advisory lock)</text>
  <text x="620" y="322" class="s">Interrupted jobs marked failed on restart; results kept 24 h</text>

  <path class="ln" d="M540,132 H588"/>

  <!-- Model -->
  <text x="30" y="394" class="h">MODEL (artifacts/model.joblib, loaded once at startup, CPU only, no network)</text>
  <rect x="30" y="406" width="1140" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="46" y="424" width="210" height="126" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="60" y="448" class="t">Preprocessing</text>
  <text x="60" y="468" class="s">channel + language hint +</text>
  <text x="60" y="484" class="s">subject + text; Unicode NFC;</text>
  <text x="60" y="500" class="s">mask synthetic refs, drop</text>
  <text x="60" y="516" class="s">quoted past messages</text>
  <text x="60" y="532" class="s">(app/preprocessing.py)</text>
  <rect x="290" y="424" width="560" height="126" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="304" y="448" class="t">Three TF-IDF pipelines (word 1–2 + char n-grams)</text>
  <text x="304" y="472" class="s">Primary category — balanced logistic regression, C=100, 11 classes</text>
  <text x="304" y="492" class="s">Secondary category — calibrated linear SVM, C=1, cutoff 0.2</text>
  <text x="304" y="512" class="s">Urgency — balanced logistic regression, C=40, cutoff 0.3</text>
  <text x="304" y="536" class="s">Seed 42; frozen in configs/training.json</text>
  <rect x="884" y="424" width="270" height="126" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="898" y="448" class="t">Rules + routing</text>
  <text x="898" y="468" class="s">Narrow precedence rules</text>
  <text x="898" y="484" class="s">Fixed category → team map</text>
  <text x="898" y="500" class="s">Human review if confidence</text>
  <text x="898" y="516" class="s">&lt; 0.5 or ≤ 3 words</text>
  <text x="898" y="536" class="s">→ prediction JSON</text>
  <path class="ln" d="M256,487 H288"/>
  <path class="ln" d="M850,487 H882"/>

  <path class="ln" d="M740,346 V404"/>
  <text x="748" y="380" class="lb">predict_many()</text>

  <!-- Storage -->
  <text x="590" y="612" class="h">PERSISTENCE (app/database.py)</text>
  <rect x="590" y="624" width="580" height="126" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="606" y="650" class="t">Tables: jobs, dashboard_sessions, support_tickets</text>
  <text x="606" y="674" class="s">SQLite file (default; single container, volume /app/data)</text>
  <text x="606" y="694" class="s">PostgreSQL when DATABASE_URL is set:</text>
  <text x="606" y="712" class="s">  Docker Compose Postgres, or Supabase transaction pooler (hosted)</text>
  <text x="606" y="732" class="s">Shared by API and queue worker so state survives cold starts</text>
  <path class="ln" d="M1160,346 C1190,420 1190,560 1150,622"/>
  <text x="1080" y="600" class="lb">job state + results</text>

  <!-- Offline training -->
  <text x="30" y="612" class="h">OFFLINE TRAINING (not in request path)</text>
  <rect x="30" y="624" width="520" height="126" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="46" y="650" class="t">scripts/train_model.py</text>
  <text x="46" y="672" class="s">datasets/train.csv (4,000) + validation.csv (800), checksummed</text>
  <text x="46" y="690" class="s">Stratified 75/25 split of train.csv → held-out scores</text>
  <text x="46" y="708" class="s">Refit on all 4,800 → artifacts/model.joblib</text>
  <text x="46" y="726" class="s">Writes evaluation_metrics.json + breakdown; notebook report</text>
  <path class="dl" d="M450,622 V568"/>
  <text x="458" y="598" class="lb">bundled into image / deploy</text>
</svg>
